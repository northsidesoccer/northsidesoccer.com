name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9

      - name: Run Hugo from devshell
        run: nix develop -c hugo

      - name: Publish (dry nun)
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          nix shell nixpkgs#lftp -c "lftp -u \"$SFTP_USERNAME\",\"$SFTP_PASSWORD\" \"sftp://$SFTP_HOST:2222\" -e \"set sftp:auto-confirm yes; mirror -R --dry-run --verbose ./public/ ./; bye\""
