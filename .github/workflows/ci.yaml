name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9

      - name: Run Hugo
        run: nix develop -c hugo

      - name: Publish (dry nun)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          umask 077
          cat >"$HOME/.netrc" <<EOF
          machine $FTP_HOST
          login $FTP_USERNAME
          password $FTP_PASSWORD
          EOF
          chmod 600 "$HOME/.netrc"

          nix develop -c lftp <<EOF
          debug 0
          open "sftp://$FTP_SERVER:2222"
          mirror -R --parallel=4 --dry-run --verbose ./public/ ./
          bye
          EOF
