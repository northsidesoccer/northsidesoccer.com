name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@38852f089fdd2f5aabeec42c59c8d180bb8a15e9

      - name: Run Hugo
        run: nix develop -c hugo

      - name: Publish (dry nun)
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          NETRC_FILE=$(mktemp)
          chmod 600 "$NETRC_FILE"
          trap 'rm -f "$NETRC_FILE"' EXIT

          cat >"$NETRC_FILE" <<EOF
          machine $FTP_SERVER
          login $FTP_USERNAME
          password $FTP_PASSWORD
          EOF

          nix shell nixpkgs#lftp nixpkgs#openssh -c lftp <<EOF
          debug 0
          set net:use-netrc true
          set net:netrc-file "$NETRC_FILE"
          set net:timeout 15
          set net:max-retries 1
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -o ControlMaster=auto -o ControlPersist=60 -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa -o KexAlgorithms=+diffie-hellman-group14-sha1,diffie-hellman-group1-sha1"
          open "sftp://$FTP_SERVER:2222"
          mirror -R --parallel=4 --dry-run --verbose ./public/ ./
          bye
          EOF
